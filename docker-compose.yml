services:
  postgres:
    image: postgres:16-alpine
    network_mode: host
    restart: always
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce_pass
      POSTGRES_DB: ecommerce_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  server:
    build: ./server
    network_mode: host
    restart: always
    environment:
      DATABASE_URL: postgresql://ecommerce:ecommerce_pass@localhost:5432/ecommerce_db
      JWT_SECRET: change_this_secret_in_production
      PORT: 5000
      CLIENT_URL: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node src/index.js"

  client:
    build: ./client
    network_mode: host
    restart: always
    environment:
      VITE_API_URL: http://localhost:5000/api

volumes:
  pgdata:
